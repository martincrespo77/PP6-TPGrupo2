<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>Tu cuenta – Acortador de enlaces PP6</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<main>
		<header class="hero">
			<h1>Tus enlaces</h1>
			<p id="account" class="muted"></p>
		</header>

		<div class="panel" id="panel" hidden>
			<form id="username-form" novalidate>
				<div class="step">
					<span class="step-number" aria-hidden="true">1</span>
					<label for="username">Tu nombre de usuario</label>
				</div>
				<p id="username-hint" class="muted hint"></p>
				<div class="row">
					<div class="field">
						<input id="username" name="username" type="text" autocomplete="off" spellcheck="false"
							maxlength="20" placeholder="por ejemplo, martin" required>
					</div>
					<button id="save-username" type="submit">GUARDAR</button>
				</div>
				<div id="previous-name" class="reservation" role="status" hidden>
					<p id="previous-name-text"></p>
					<button id="revert-username" type="button" class="secondary">VOLVER AL NOMBRE ANTERIOR</button>
				</div>
			</form>

			<form id="link-form" class="link-form" novalidate hidden>
				<div class="step">
					<span class="step-number" aria-hidden="true">2</span>
					<label for="url">Dirección a acortar</label>
				</div>
				<div class="field">
					<input id="url" name="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
						placeholder="https://..." required>
				</div>
				<label for="alias" class="sub-label">Alias (opcional)</label>
				<p class="muted hint">Si lo dejás vacío se genera uno aleatorio, que después podés cambiar.</p>
				<div class="row">
					<div class="field">
						<span id="namespace" class="namespace"></span>
						<input id="alias" name="alias" type="text" autocomplete="off" spellcheck="false"
							maxlength="32" placeholder="aleatorio">
					</div>
					<button id="create" type="submit">CREAR ENLACE</button>
				</div>
			</form>

			<p id="status" class="status" role="status" aria-live="polite"></p>

			<section id="result" class="result" hidden aria-labelledby="result-title">
				<h2 id="result-title">Tu enlace</h2>
				<div class="result-box">
					<a id="short-url" class="short-url" target="_blank" rel="noopener"></a>
					<div class="actions">
						<a id="download" class="button secondary">Descargar QR</a>
						<button id="copy" type="button" class="dark">Copiar</button>
					</div>
				</div>
				<form id="rename-form" class="link-form" novalidate>
					<label for="new-alias" class="sub-label">Cambiar alias</label>
					<div class="row">
						<div class="field">
							<span id="rename-namespace" class="namespace"></span>
							<input id="new-alias" name="new-alias" type="text" autocomplete="off" spellcheck="false"
								maxlength="32" required>
						</div>
						<button id="rename" type="submit">GUARDAR ALIAS</button>
					</div>
				</form>
				<img id="qr" class="qr" width="256" height="256" alt="">
				<p id="expires" class="muted expires"></p>
			</section>
		</div>

		<footer class="muted">
			<a href="/">Acortador público</a> ·
			<button id="logout" type="button" class="link-button">Cerrar sesión</button>
		</footer>
	</main>

	<dialog id="session-dialog" class="session-dialog" aria-labelledby="session-title" aria-describedby="session-text">
		<h2 id="session-title">¿Seguís ahí?</h2>
		<p id="session-text"></p>
		<div class="dialog-actions">
			<button id="session-extend" type="button">EXTENDER SESIÓN</button>
			<button id="session-logout" type="button" class="secondary">Cerrar sesión</button>
		</div>
	</dialog>

	<script src="/session.js"></script>
	<script src="/result-card.js"></script>
	<script src="/session-timer.js"></script>
	<script src="/cuenta.js"></script>
</body>
</html>
