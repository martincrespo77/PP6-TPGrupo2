<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>Este enlace cambió de dirección – PP6 Link Shortener</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<main>
		<div class="panel notice" role="alertdialog" aria-labelledby="moved-title" aria-describedby="moved-detail">
			<h1 id="moved-title">Este enlace cambió de dirección</h1>
			<p id="moved-detail">Su dueño cambió el nombre de usuario. La dirección que usaste
				<strong id="old-until" data-released-at="{{oldNameReleasedAt}}">deja de funcionar en unos minutos</strong>.
				Actualizala por esta:</p>
			<p><a id="new-url" class="short-url" href="{{newShortUrl}}">{{newShortUrl}}</a></p>
			<p id="countdown" class="muted" role="status" aria-live="polite"></p>
			<a id="continue" class="button" href="{{targetUrl}}">Continuar al destino</a>
		</div>
	</main>
	<script src="/enlace-movido.js"></script>
</body>
</html>
