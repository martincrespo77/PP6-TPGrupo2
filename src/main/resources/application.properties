spring.application.name=shortener

# Dominio con el que se arman la URL corta y el QR. En el VPS se sobrescribe con APP_BASE_URL.
app.base-url=${APP_BASE_URL:http://localhost:8080}

app.link.ttl=60m

app.alias.length=5
app.alias.alphabet=abcdefghjkmnpqrstuvwxyz23456789
app.alias.reserved=api,admin,static,assets,error,expired,health,actuator,swagger,favicon.ico,index
app.alias.max-attempts=10

app.cleanup.cron=0 0 3 * * *

spring.datasource.url=jdbc:hsqldb:file:./data/shortener;shutdown=true
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

hql-console.enabled=true
