spring.application.name=shortener

# Dominio con el que se arman la URL corta y el QR. En el VPS se sobrescribe con APP_BASE_URL.
app.base-url=${APP_BASE_URL:http://localhost:8080}

app.link.ttl=60m

# Alias secuencial: el menor número libre escrito con este alfabeto (1..9, a..z, 10, 11...).
# Sin i, l ni o, que se confunden con 1 y 0. El primer carácter hace de cero.
app.alias.alphabet=0123456789abcdefghjkmnpqrstuvwxyz
app.alias.reserved=api,admin,static,assets,error,expired,health,actuator,swagger,favicon.ico,index,login,logout,coloquio,descargas
app.alias.max-attempts=10

# Nombres que nadie puede elegir: rutas propias, de Spring y de la consola JPQL.
app.user.reserved=api,admin,static,assets,error,expired,health,actuator,swagger,swagger-ui,favicon.ico,index,login,logout,oauth2,jpql-console,cuenta,usuario,usuarios,users,coloquio,descargas
# Lo que dura un QR de ingreso sin aprobar.
app.login.ttl=2m

# Ingreso con Google. Las credenciales salen de variables de entorno (ver .env.example), nunca del repo.
# El redirect se arma desde app.base-url, como la URL corta (I4); en Google se registra
# {APP_BASE_URL}/login/oauth2/code/google.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:sin-configurar}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:sin-configurar}
spring.security.oauth2.client.registration.google.scope=openid,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.base-url}/login/oauth2/code/{registrationId}

# La cookie de sesión no viaja en pedidos POST desde otros sitios.
server.servlet.session.cookie.same-site=lax

app.cleanup.cron=0 0 3 * * *

spring.datasource.url=jdbc:hsqldb:file:./data/shortener;shutdown=true
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola JPQL para la defensa: ve y modifica toda la base (incluidos los usuarios). En el VPS, false.
hql-console.enabled=${HQL_CONSOLE_ENABLED:true}

# La documentación de la API es pública a propósito (la web la enlaza): no expone datos.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
