<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-labelledby="t d">
  <title id="t">Acortador de enlaces PP6</title>
  <desc id="d">Enlaces cortos con código QR que vencen a los 60 minutos. Java 25, Spring Boot 4.1, JPA, HSQLDB, ZXing y extensión Manifest V3.</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00FF9C"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102230"/>
      <stop offset="1" stop-color="#0B141C"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6F1FF"/>
      <stop offset="1" stop-color="#9FF5E0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#132030" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="189" rx="16" fill="#0B0F14" stroke="#1C2A38"/>
  <rect x="1" y="1" width="758" height="188" rx="16" fill="url(#grid)" opacity="0.55"/>

  <!-- Isotipo: hexágono + eslabón (mismo trazo que el ícono de la web) + arco de cuenta regresiva de 60 min -->
  <g>
    <circle cx="95" cy="95" r="74" fill="none" stroke="#1C2A38" stroke-width="3"/>
    <path d="M95 21 A74 74 0 1 1 30.91 58" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="30.91" cy="58" r="4.5" fill="#00FF9C" filter="url(#glow)"/>
    <g stroke="#2A3D50" stroke-width="1.5">
      <line x1="95" y1="21" x2="95" y2="29"/>
      <line x1="169" y1="95" x2="161" y2="95"/>
      <line x1="95" y1="169" x2="95" y2="161"/>
      <line x1="21" y1="95" x2="29" y2="95"/>
    </g>
    <polygon points="95,37 145.2,66 145.2,124 95,153 44.8,124 44.8,66" fill="url(#hexFill)" stroke="url(#neon)" stroke-width="2.5" stroke-linejoin="round"/>
    <g transform="translate(66.2 66.2) scale(2.4)">
      <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"
        fill="none" stroke="url(#neon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    </g>
  </g>

  <line x1="190" y1="34" x2="190" y2="156" stroke="#1C2A38"/>

  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
    <text x="206" y="56" font-size="11" letter-spacing="3" fill="#4FB3C8">PP6 · TP INTEGRADOR · GRUPO 2 · FIE</text>
    <text x="204" y="94" font-size="32" font-weight="700" letter-spacing="1" fill="url(#title)">ACORTADOR DE ENLACES</text>
    <text x="206" y="118" font-size="12" fill="#8DA2B6">Enlaces cortos + QR que vencen a los 60 min · API REST + Web + Extensión</text>

    <g font-size="11" font-weight="700" text-anchor="middle">
      <rect x="206" y="134" width="62" height="24" rx="4" fill="#0F1A24" stroke="#00E5FF"/>
      <text x="237" y="150" fill="#00E5FF">JAVA 25</text>
      <rect x="274" y="134" width="115" height="24" rx="4" fill="#0F1A24" stroke="#00FF9C"/>
      <text x="331.5" y="150" fill="#00FF9C">SPRING BOOT 4.1</text>
      <rect x="395" y="134" width="115" height="24" rx="4" fill="#0F1A24" stroke="#FFB020"/>
      <text x="452.5" y="150" fill="#FFB020">JPA · HIBERNATE</text>
      <rect x="516" y="134" width="56" height="24" rx="4" fill="#0F1A24" stroke="#00FF9C"/>
      <text x="544" y="150" fill="#00FF9C">HSQLDB</text>
      <rect x="578" y="134" width="69" height="24" rx="4" fill="#0F1A24" stroke="#00E5FF"/>
      <text x="612.5" y="150" fill="#00E5FF">ZXING QR</text>
      <rect x="653" y="134" width="89" height="24" rx="4" fill="#0F1A24" stroke="#B388FF"/>
      <text x="697.5" y="150" fill="#B388FF">MANIFEST V3</text>
    </g>
  </g>
</svg>
