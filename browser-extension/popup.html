<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Acortador de enlaces – PP6</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<main>
		<header class="brand">
			<img src="icons/icon-32.png" width="24" height="24" alt="">
			<h1>Enlace corto de esta página</h1>
		</header>
		<p id="page-url" class="page-url"></p>
		<p id="mode" class="muted mode" hidden></p>

		<p id="status" class="status" role="status" aria-live="polite"></p>

		<section id="result" class="card" hidden>
			<div class="row">
				<a id="short-url" class="short-url" target="_blank" rel="noopener"></a>
				<div class="actions">
					<button id="copy" type="button" class="icon-button dark" aria-label="Copiar enlace" title="Copiar enlace">
						<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
							<rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
							<path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"
								fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
						</svg>
					</button>
					<a id="download" class="icon-button" target="_blank" rel="noopener" aria-label="Descargar QR" title="Descargar QR">
						<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
							<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"
								fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</a>
				</div>
			</div>
			<img id="qr" class="qr" width="160" height="160" alt="">
			<p id="expires" class="muted"></p>
		</section>
	</main>

	<script src="config.js"></script>
	<script src="popup.js"></script>
</body>
</html>
